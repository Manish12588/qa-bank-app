name: Stage (reusable)

# One stage = start the app for that environment, run the selected tests, upload reports.
# Called three times by promotion.yml (DEV, QA, STAGE).
on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment name: DEV, QA or STAGE"
        required: true
        type: string
      test_args:
        description: "Extra Playwright arguments, e.g. --grep @smoke. Empty runs everything."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment gives this job its own variables (APP_PORT) and its approval rules.
    environment: ${{ inputs.environment }}

    env:
      APP_PORT: ${{ vars.APP_PORT || '8080' }}

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: Manish12588/qa-bank-app-test
          path: e2e-tests

      - name: Start QABank on port ${{ env.APP_PORT }} and wait until healthy
        run: docker compose up -d --build --wait

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: e2e-tests/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('e2e-tests/package-lock.json') }}

      - name: Install dependencies
        working-directory: e2e-tests
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e-tests
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e-tests
        run: npx playwright install-deps chromium

      - name: Run tests (${{ inputs.test_args || 'all tests' }})
        working-directory: e2e-tests
        run: npx playwright test ${{ inputs.test_args }}
        env:
          ENV: ${{ inputs.environment }}
          API_BASE_URL: http://localhost:${{ env.APP_PORT }}/api
          WEB_BASE_URL: http://localhost:${{ env.APP_PORT }}

      - name: App logs
        if: failure()
        run: docker compose logs

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.environment }}-html-report
          path: e2e-tests/reports/html-report/
          retention-days: 30

      - name: Upload reportingLabs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.environment }}-reporting-labs
          path: e2e-tests/reporting-labs/
          retention-days: 30
