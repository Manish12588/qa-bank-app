<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QABank | Request Loan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a href="dashboard.html" class="brand">QA<span>Bank</span></a>
      <nav>
        <a href="dashboard.html">Accounts Overview</a>
        <a href="openaccount.html">Open New Account</a>
        <a href="transfer.html">Transfer Funds</a>
        <a href="billpay.html">Bill Pay</a>
        <a href="loan.html" class="active">Request Loan</a>
        <a href="findtrans.html">Find Transactions</a>
      </nav>
      <a href="#" id="logoutLink" class="logout-link">Log Out</a>
    </aside>

    <main class="main-content">
      <h2>Request Loan</h2>
      <p class="page-sub">Approval is instant — based on your down payment.</p>

      <div class="content-grid">
        <div class="card" style="max-width:none;">
          <form id="loanForm">
            <label for="amount">Loan Amount</label>
            <input id="amount" name="amount" required>

            <label for="downPayment">Down Payment</label>
            <input id="downPayment" name="downPayment" required>

            <label for="fromAccountId">From Account</label>
            <select id="fromAccountId" name="fromAccountId"></select>

            <button type="submit" id="applyButton">Apply Now</button>
          </form>

          <div id="loanResult"></div>
        </div>

        <div class="side-card">
          <h3>Your Accounts</h3>
          <div id="sideAccounts"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    function renderSideAccounts(accounts) {
      const el = document.getElementById("sideAccounts");
      el.innerHTML = accounts.map((acc) => `
        <div class="mini-account-row">
          <div><div>#${acc.id}</div><div class="acc-type">${acc.type}</div></div>
          <div class="acc-balance">$${acc.balance.toFixed(2)}</div>
        </div>
      `).join("");
    }

    async function loadAccountOptions() {
      const res = await api("GET", "/api/accounts");
      if (!res.ok) { window.location.href = "login.html"; return; }
      const sel = document.getElementById("fromAccountId");
      sel.innerHTML = "";
      res.data.forEach((acc) => {
        const opt = document.createElement("option");
        opt.value = acc.id;
        opt.textContent = `${acc.id} (${acc.type}) - $${acc.balance.toFixed(2)}`;
        sel.appendChild(opt);
      });
      renderSideAccounts(res.data);
    }
    document.getElementById("loanForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const res = await api("POST", "/api/loan", {
        amount: form.amount.value,
        downPayment: form.downPayment.value,
        fromAccountId: Number(form.fromAccountId.value),
      });
      const div = document.getElementById("loanResult");
      if (res.ok && res.data.approved) {
        div.innerHTML = `<p class="success" id="loanStatus">Congratulations, your loan has been approved.</p><p>New loan account: <span id="loanAccountId">${res.data.accountId}</span></p>`;
        loadAccountOptions();
      } else if (res.ok) {
        div.innerHTML = `<p class="error" id="loanStatus">Your loan request has been denied.</p>`;
      } else {
        div.innerHTML = `<p class="error" id="loanStatus">${(res.data && res.data.error) || "Loan request failed."}</p>`;
      }
    });
    document.getElementById("logoutLink").addEventListener("click", async (e) => {
      e.preventDefault();
      await api("POST", "/api/logout");
      window.location.href = "login.html";
    });
    loadAccountOptions();
  </script>
</body>
</html>
