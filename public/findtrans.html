<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QABank | Find Transactions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a href="dashboard.html" class="brand">QA<span>Bank</span></a>
      <nav>
        <a href="dashboard.html">Accounts Overview</a>
        <a href="openaccount.html">Open New Account</a>
        <a href="transfer.html">Transfer Funds</a>
        <a href="billpay.html">Bill Pay</a>
        <a href="loan.html">Request Loan</a>
        <a href="findtrans.html" class="active">Find Transactions</a>
      </nav>
      <a href="#" id="logoutLink" class="logout-link">Log Out</a>
    </aside>

    <main class="main-content">
      <h2>Find Transactions</h2>
      <p class="page-sub">Search and filter an account's transaction history.</p>

      <div class="content-grid">
        <div class="card" style="max-width:none;">
          <form id="findForm">
            <label for="accountId">Account</label>
            <select id="accountId" name="accountId"></select>

            <label for="amount">By Amount (optional)</label>
            <input id="amount" name="amount">

            <label for="type">By Type (optional)</label>
            <select id="type" name="type">
              <option value="All">All</option>
              <option value="Debit">Debit</option>
              <option value="Credit">Credit</option>
            </select>

            <button type="submit" id="findButton">Find Transactions</button>
          </form>

          <table id="transactionResults">
            <thead><tr><th>Date</th><th>Description</th><th>Debit/Credit</th><th>Amount</th></tr></thead>
            <tbody id="transactionRows"></tbody>
          </table>
        </div>

        <div class="side-card">
          <h3>Your Accounts</h3>
          <div id="sideAccounts"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    function renderSideAccounts(accounts) {
      const el = document.getElementById("sideAccounts");
      el.innerHTML = accounts.map((acc) => `
        <div class="mini-account-row">
          <div><div>#${acc.id}</div><div class="acc-type">${acc.type}</div></div>
          <div class="acc-balance">$${acc.balance.toFixed(2)}</div>
        </div>
      `).join("");
    }

    async function loadAccountOptions(preselectId) {
      const res = await api("GET", "/api/accounts");
      if (!res.ok) { window.location.href = "login.html"; return; }
      const sel = document.getElementById("accountId");
      sel.innerHTML = "";
      res.data.forEach((acc) => {
        const opt = document.createElement("option");
        opt.value = acc.id;
        opt.textContent = `${acc.id} (${acc.type})`;
        if (preselectId && Number(preselectId) === acc.id) opt.selected = true;
        sel.appendChild(opt);
      });
      renderSideAccounts(res.data);
    }
    async function runSearch(e) {
      if (e) e.preventDefault();
      const accountId = document.getElementById("accountId").value;
      const amount = document.getElementById("amount").value;
      const type = document.getElementById("type").value;
      const params = new URLSearchParams();
      if (amount) params.set("amount", amount);
      if (type) params.set("type", type);
      const res = await api("GET", `/api/accounts/${accountId}/transactions?${params.toString()}`);
      const tbody = document.getElementById("transactionRows");
      tbody.innerHTML = "";
      if (res.ok) {
        res.data.forEach((t) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${new Date(t.date).toLocaleDateString()}</td><td>${t.description}</td><td>${t.type}</td><td>$${t.amount.toFixed(2)}</td>`;
          tbody.appendChild(tr);
        });
      }
    }
    document.getElementById("findForm").addEventListener("submit", runSearch);
    document.getElementById("logoutLink").addEventListener("click", async (e) => {
      e.preventDefault();
      await api("POST", "/api/logout");
      window.location.href = "login.html";
    });
    const urlParams = new URLSearchParams(window.location.search);
    loadAccountOptions(urlParams.get("accountId")).then(() => runSearch());
  </script>
</body>
</html>
